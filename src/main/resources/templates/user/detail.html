<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="en">
<head>
    <meta charset="UTF-8">
    <title>User Profile - AcxiomCRM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container py-4 flex-grow-1">
    <div th:replace="~{fragments/alerts :: alerts}"></div>

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="h3 fw-bold mb-1" th:text="${user.fullName}">User Name</h2>
            <span class="badge" th:classappend="
                ${user.role.name() == 'ROLE_ADMIN'} ? 'bg-danger' : (
                ${user.role.name() == 'ROLE_MANAGER'} ? 'bg-warning text-dark' : 'bg-primary')"
                th:text="${user.role}">ROLE</span>
            <span class="badge ms-1" th:classappend="${user.active} ? 'bg-success' : 'bg-secondary'" th:text="${user.active} ? 'Active' : 'Inactive'">Active</span>
        </div>
        <div>
            <a th:if="${isAdmin}" th:href="@{/admin/users/{id}/edit(id=${user.id})}" class="btn btn-outline-primary me-2"><i class="bi bi-pencil me-1"></i>Edit</a>
            <a th:href="@{/admin/users}" class="btn btn-outline-secondary"><i class="bi bi-arrow-left me-1"></i>Back</a>
        </div>
    </div>

    <div class="row g-4">
        <div class="col-md-7">
            <div class="card shadow-sm border-0 h-100">
                <div class="card-header bg-white fw-bold"><i class="bi bi-person-circle me-2 text-primary"></i>Account Details</div>
                <div class="card-body">
                    <dl class="row mb-0">
                        <dt class="col-sm-4 text-muted">Email:</dt>
                        <dd class="col-sm-8" th:text="${user.email}">user@acxiomcrm.com</dd>

                        <dt class="col-sm-4 text-muted">Role:</dt>
                        <dd class="col-sm-8" th:text="${user.role}">ROLE_SALES_EXECUTIVE</dd>

                        <dt class="col-sm-4 text-muted">Status:</dt>
                        <dd class="col-sm-8" th:text="${user.active ? 'Active' : 'Inactive'}">Active</dd>

                        <dt class="col-sm-4 text-muted">Failed Logins:</dt>
                        <dd class="col-sm-8" th:text="${user.failedLoginCount}">0</dd>

                        <dt class="col-sm-4 text-muted">Lockout Status:</dt>
                        <dd class="col-sm-8">
                            <span th:if="${user.lockoutEnd != null and user.lockoutEnd.isAfter(T(java.time.LocalDateTime).now())}" class="badge bg-danger">
                                Locked until <span th:text="${#temporals.format(user.lockoutEnd, 'yyyy-MM-dd HH:mm:ss')}">Time</span>
                            </span>
                            <span th:if="${user.lockoutEnd == null or !user.lockoutEnd.isAfter(T(java.time.LocalDateTime).now())}" class="badge bg-success">
                                Not Locked
                            </span>
                        </dd>

                        <dt class="col-sm-4 text-muted">Created Date:</dt>
                        <dd class="col-sm-8" th:text="${#temporals.format(user.createdDate, 'yyyy-MM-dd HH:mm')}">-</dd>
                    </dl>
                </div>
            </div>
        </div>

        <div class="col-md-5" th:if="${isAdmin}">
            <div class="card shadow-sm border-0 mb-3">
                <div class="card-header bg-white fw-bold"><i class="bi bi-shield-lock me-2 text-primary"></i>Administrative Actions</div>
                <div class="card-body d-flex flex-column gap-2">
                    <!-- Toggle Active -->
                    <form th:action="@{/admin/users/{id}/toggle-active(id=${user.id})}" method="post">
                        <button type="submit" class="btn w-100" th:classappend="${user.active} ? 'btn-outline-danger' : 'btn-outline-success'">
                            <span th:text="${user.active} ? 'Deactivate Account' : 'Activate Account'">Toggle</span>
                        </button>
                    </form>

                    <!-- Unlock Account -->
                    <form th:action="@{/admin/users/{id}/unlock(id=${user.id})}" method="post">
                        <button type="submit" class="btn btn-outline-warning text-dark w-100">
                            <i class="bi bi-unlock me-1"></i>Reset Lockout & Failed Counter
                        </button>
                    </form>

                    <!-- Reset Password Trigger -->
                    <button type="button" class="btn btn-outline-secondary w-100" data-bs-toggle="modal" data-bs-target="#resetPasswordModal">
                        <i class="bi bi-key me-1"></i>Set New Password
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Reset Password Modal -->
    <div class="modal fade" id="resetPasswordModal" tabindex="-1" aria-hidden="true" th:if="${isAdmin}">
        <div class="modal-dialog">
            <div class="modal-content">
                <form th:action="@{/admin/users/{id}/reset-password(id=${user.id})}" method="post">
                    <div class="modal-header">
                        <h5 class="modal-title">Reset User Password</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <div class="mb-3">
                            <label for="newPassword" class="form-label">New Password</label>
                            <input type="password" class="form-control" id="newPassword" name="newPassword" required placeholder="Min 8 chars, mixed case, digit, special">
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary">Reset Password</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
