<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="en">
<head>
    <meta charset="UTF-8">
    <title>User & Role Management - AcxiomCRM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container-fluid px-4 flex-grow-1">
    <div th:replace="~{fragments/alerts :: alerts}"></div>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
            <h2 class="h3 fw-bold mb-0"><i class="bi bi-people-fill me-2"></i>User & Role Administration</h2>
            <p class="text-muted mb-0">Manage CRM user access, roles, active status, and lockouts</p>
        </div>
        <div th:if="${isAdmin}">
            <a th:href="@{/admin/users/new}" class="btn btn-primary shadow-sm">
                <i class="bi bi-person-plus me-1"></i>Create New User
            </a>
        </div>
    </div>

    <!-- Filters -->
    <div class="card mb-4 shadow-sm border-0">
        <div class="card-body">
            <form th:action="@{/admin/users}" method="get" class="row g-3 align-items-center">
                <div class="col-md-5">
                    <input type="text" name="search" class="form-control" placeholder="Search by name, email..." th:value="${search}">
                </div>
                <div class="col-md-3">
                    <select name="role" class="form-select">
                        <option value="">All Roles</option>
                        <option th:each="r : ${roles}" th:value="${r}" th:text="${r}" th:selected="${selectedRole == r}"></option>
                    </select>
                </div>
                <div class="col-md-2">
                    <select name="active" class="form-select">
                        <option value="">All Statuses</option>
                        <option value="true" th:selected="${selectedActive == true}">Active</option>
                        <option value="false" th:selected="${selectedActive == false}">Inactive</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <button type="submit" class="btn btn-secondary w-100"><i class="bi bi-funnel me-1"></i>Filter</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Table -->
    <div class="card shadow-sm border-0">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                    <tr>
                        <th>Full Name</th>
                        <th>Email</th>
                        <th>Role</th>
                        <th>Status</th>
                        <th>Lockout Status</th>
                        <th>Created Date</th>
                        <th class="text-end">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${users.empty}">
                        <td colspan="7" class="text-center py-4 text-muted">No users found.</td>
                    </tr>
                    <tr th:each="u : ${users.content}">
                        <td class="fw-bold"><a th:href="@{/admin/users/{id}(id=${u.id})}" th:text="${u.fullName}" class="text-decoration-none text-dark">User</a></td>
                        <td th:text="${u.email}">email</td>
                        <td>
                            <span class="badge" th:classappend="
                                ${u.role.name() == 'ROLE_ADMIN'} ? 'bg-danger' : (
                                ${u.role.name() == 'ROLE_MANAGER'} ? 'bg-warning text-dark' : 'bg-primary')"
                                th:text="${u.role}">ROLE</span>
                        </td>
                        <td>
                            <span class="badge" th:classappend="${u.active} ? 'bg-success' : 'bg-secondary'" th:text="${u.active} ? 'Active' : 'Inactive'">Active</span>
                        </td>
                        <td>
                            <span th:if="${u.lockoutEnd != null and u.lockoutEnd.isAfter(T(java.time.LocalDateTime).now())}" class="badge bg-danger">
                                <i class="bi bi-lock-fill me-1"></i>Locked
                            </span>
                            <span th:if="${u.lockoutEnd == null or !u.lockoutEnd.isAfter(T(java.time.LocalDateTime).now())}" class="badge bg-light text-secondary border">
                                Unlocked (<span th:text="${u.failedLoginCount}">0</span> failed)
                            </span>
                        </td>
                        <td th:text="${#temporals.format(u.createdDate, 'yyyy-MM-dd')}">Date</td>
                        <td class="text-end">
                            <a th:href="@{/admin/users/{id}(id=${u.id})}" class="btn btn-sm btn-outline-info me-1"><i class="bi bi-eye"></i></a>
                            <a th:if="${isAdmin}" th:href="@{/admin/users/{id}/edit(id=${u.id})}" class="btn btn-sm btn-outline-primary"><i class="bi bi-pencil"></i></a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div th:replace="~{fragments/pagination :: pagination(${users}, '/admin/users')}"></div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
