<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="en">
<head>
    <meta charset="UTF-8">
    <title th:text="${customerId != null ? 'Edit Customer' : 'New Customer'} + ' - AcxiomCRM'">Customer Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container py-4 flex-grow-1">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-white py-3">
                    <h4 class="mb-0 fw-bold" th:text="${customerId != null ? 'Edit Customer' : 'Create New Customer'}">Customer</h4>
                </div>
                <div class="card-body p-4">
                    <form th:action="${customerId != null ? '/customers/' + customerId + '/edit' : '/customers'}"
                          th:object="${customerForm}" method="post" class="needs-validation" novalidate>

                        <div class="row g-3">
                            <div class="col-md-6">
                                <label for="name" class="form-label">Customer Name <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="name" th:field="*{name}" required maxlength="200" placeholder="Acme Enterprises">
                                <div class="invalid-feedback">Customer Name is required.</div>
                                <div class="text-danger small" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                            </div>

                            <div class="col-md-6">
                                <label for="company" class="form-label">Company</label>
                                <input type="text" class="form-control" id="company" th:field="*{company}" placeholder="Acme Corp">
                            </div>

                            <div class="col-md-6">
                                <label for="email" class="form-label">Email Address <span class="text-danger">*</span></label>
                                <input type="email" class="form-control" id="email" th:field="*{email}" required placeholder="billing@acme.com">
                                <div class="invalid-feedback">Enter a valid email address.</div>
                                <div class="text-danger small" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                            </div>

                            <div class="col-md-6">
                                <label for="phone" class="form-label">Phone Number <span class="text-danger">*</span></label>
                                <input type="tel" class="form-control" id="phone" th:field="*{phone}" required placeholder="9876543210 (10 digits)">
                                <div class="invalid-feedback">Enter a valid phone number.</div>
                                <div class="text-danger small" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
                            </div>

                            <div class="col-12">
                                <label for="address" class="form-label">Address</label>
                                <textarea class="form-control" id="address" th:field="*{address}" rows="2" placeholder="Street, City, State, ZIP"></textarea>
                            </div>

                            <div class="col-12">
                                <label for="notes" class="form-label">Notes</label>
                                <textarea class="form-control" id="notes" th:field="*{notes}" rows="3" placeholder="Additional customer notes and history..."></textarea>
                            </div>

                            <div class="col-md-6" sec:authorize="hasAnyRole('ADMIN','MANAGER')">
                                <label for="assignedToId" class="form-label">Assign To Executive</label>
                                <select class="form-select" id="assignedToId" th:field="*{assignedToId}">
                                    <option value="">-- Select Sales Executive --</option>
                                    <option th:each="u : ${salesUsers}" th:value="${u.id}" th:text="${u.fullName} + ' (' + ${u.email} + ')'"></option>
                                </select>
                            </div>

                            <div class="col-md-6 d-flex align-items-center mt-4">
                                <div class="form-check form-switch">
                                    <input class="form-check-input" type="checkbox" id="active" th:field="*{active}">
                                    <label class="form-check-label fw-semibold" for="active">Active Customer</label>
                                </div>
                            </div>
                        </div>

                        <hr class="my-4">

                        <div class="d-flex justify-content-end gap-2">
                            <a th:href="@{/customers}" class="btn btn-outline-secondary">Cancel</a>
                            <button type="submit" class="btn btn-primary px-4 fw-semibold">
                                <i class="bi bi-save me-1"></i>Save Customer
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
