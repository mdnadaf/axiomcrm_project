<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="en">
<head>
    <meta charset="UTF-8">
    <title>Leads - AcxiomCRM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container-fluid px-4 flex-grow-1">
    <div th:replace="~{fragments/alerts :: alerts}"></div>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="h3 fw-bold mb-0"><i class="bi bi-funnel me-2"></i>Leads</h2>
        <a th:href="@{/leads/new}" class="btn btn-primary shadow-sm">
            <i class="bi bi-plus-circle me-1"></i>New Lead
        </a>
    </div>

    <!-- Search and Filter bar -->
    <div class="card mb-4 shadow-sm border-0">
        <div class="card-body">
            <form th:action="@{/leads}" method="get" class="row g-3 align-items-center">
                <div class="col-md-5">
                    <div class="input-group">
                        <span class="input-group-text bg-white"><i class="bi bi-search"></i></span>
                        <input type="text" name="search" class="form-control" placeholder="Search by name, company..." th:value="${search}">
                    </div>
                </div>
                <div class="col-md-3">
                    <select name="status" class="form-select">
                        <option value="" th:selected="${status == null or status == ''}">All Statuses</option>
                        <option value="NEW" th:selected="${status == 'NEW'}">NEW</option>
                        <option value="CONTACTED" th:selected="${status == 'CONTACTED'}">CONTACTED</option>
                        <option value="QUALIFIED" th:selected="${status == 'QUALIFIED'}">QUALIFIED</option>
                        <option value="UNQUALIFIED" th:selected="${status == 'UNQUALIFIED'}">UNQUALIFIED</option>
                        <option value="CONVERTED" th:selected="${status == 'CONVERTED'}">CONVERTED</option>
                        <option value="LOST" th:selected="${status == 'LOST'}">LOST</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <button type="submit" class="btn btn-secondary w-100"><i class="bi bi-funnel me-1"></i>Filter</button>
                </div>
                <div class="col-md-2 text-end">
                    <a th:href="@{/leads}" class="btn btn-outline-secondary w-100">Reset</a>
                </div>
            </form>
        </div>
    </div>

    <!-- Leads Table -->
    <div class="card shadow-sm border-0">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                    <tr>
                        <th>Code</th>
                        <th>Name</th>
                        <th>Company</th>
                        <th>Email</th>
                        <th>Phone</th>
                        <th>Status</th>
                        <th>Expected Value</th>
                        <th>Assigned To</th>
                        <th class="text-end">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${leads.empty}">
                        <td colspan="9" class="text-center py-4 text-muted">No lead records found.</td>
                    </tr>
                    <tr th:each="l : ${leads.content}">
                        <td><span class="badge bg-secondary font-monospace" th:text="${l.leadCode}">LEAD-0001</span></td>
                        <td>
                            <a th:href="@{/leads/{id}(id=${l.id})}" class="fw-bold text-decoration-none text-primary" th:text="${l.name}">Name</a>
                        </td>
                        <td th:text="${l.company != null ? l.company : '-'}">-</td>
                        <td th:text="${l.email}">email</td>
                        <td th:text="${l.phone != null ? l.phone : '-'}">-</td>
                        <td>
                            <span class="badge" th:classappend="
                                ${l.status.name() == 'NEW'} ? 'bg-primary' : (
                                ${l.status.name() == 'CONTACTED'} ? 'bg-info text-dark' : (
                                ${l.status.name() == 'QUALIFIED'} ? 'bg-warning text-dark' : (
                                ${l.status.name() == 'CONVERTED'} ? 'bg-success' : 'bg-danger')))"
                                th:text="${l.status}">NEW</span>
                        </td>
                        <td th:text="${l.expectedValue != null ? '$' + l.expectedValue : '-'}">-</td>
                        <td th:text="${l.assignedTo != null ? l.assignedTo.fullName : 'Unassigned'}">Assigned</td>
                        <td class="text-end">
                            <a th:href="@{/leads/{id}(id=${l.id})}" class="btn btn-sm btn-outline-info me-1" title="View Details"><i class="bi bi-eye"></i></a>
                            <a th:href="@{/leads/{id}/edit(id=${l.id})}" class="btn btn-sm btn-outline-primary me-1" title="Edit"><i class="bi bi-pencil"></i></a>
                            <button type="button" class="btn btn-sm btn-outline-danger" sec:authorize="hasAnyRole('ADMIN','MANAGER')"
                                    data-bs-toggle="modal" th:data-bs-target="'#deleteModal' + ${l.id}" title="Delete">
                                <i class="bi bi-trash"></i>
                            </button>

                            <!-- Confirm Modal -->
                            <div class="modal fade text-start" th:id="'deleteModal' + ${l.id}" tabindex="-1" aria-hidden="true">
                                <div class="modal-dialog">
                                    <div class="modal-content">
                                        <div class="modal-header">
                                            <h5 class="modal-title">Confirm Delete</h5>
                                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                                        </div>
                                        <div class="modal-body">
                                            Are you sure you want to delete lead <strong th:text="${l.name}"></strong>?
                                        </div>
                                        <div class="modal-footer">
                                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                                            <form th:action="@{/leads/{id}/delete(id=${l.id})}" method="post">
                                                <button type="submit" class="btn btn-danger">Delete</button>
                                            </form>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Pagination -->
    <div th:replace="~{fragments/pagination :: pagination(${leads}, '/leads')}"></div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
