<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="en">
<head>
    <meta charset="UTF-8">
    <title th:text="${leadId != null ? 'Edit Lead' : 'New Lead'} + ' - AcxiomCRM'">Lead Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container py-4 flex-grow-1">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-white py-3">
                    <h4 class="mb-0 fw-bold" th:text="${leadId != null ? 'Edit Lead' : 'Capture New Lead'}">Lead Form</h4>
                </div>
                <div class="card-body p-4">
                    <form th:action="${leadId != null ? '/leads/' + leadId + '/edit' : '/leads'}"
                          th:object="${leadForm}" method="post" class="needs-validation" novalidate>

                        <div class="row g-3">
                            <div class="col-md-6">
                                <label for="name" class="form-label">Lead Name <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="name" th:field="*{name}" required placeholder="Jane Smith">
                                <div class="invalid-feedback">Lead name is mandatory.</div>
                                <div class="text-danger small" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                            </div>

                            <div class="col-md-6">
                                <label for="company" class="form-label">Company</label>
                                <input type="text" class="form-control" id="company" th:field="*{company}" placeholder="Zenith Technologies">
                            </div>

                            <div class="col-md-6">
                                <label for="email" class="form-label">Email Address <span class="text-danger">*</span></label>
                                <input type="email" class="form-control" id="email" th:field="*{email}" required placeholder="jane@zenith.com">
                                <div class="invalid-feedback">Enter a valid email address.</div>
                                <div class="text-danger small" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                            </div>

                            <div class="col-md-6">
                                <label for="phone" class="form-label">Phone Number</label>
                                <input type="tel" class="form-control" id="phone" th:field="*{phone}" placeholder="9876543210 (10 digits)">
                                <div class="invalid-feedback">Enter a valid phone number.</div>
                                <div class="text-danger small" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
                            </div>

                            <div class="col-md-6">
                                <label for="status" class="form-label">Lead Status <span class="text-danger">*</span></label>
                                <select class="form-select" id="status" th:field="*{status}" required>
                                    <option value="NEW">NEW</option>
                                    <option value="CONTACTED">CONTACTED</option>
                                    <option value="QUALIFIED">QUALIFIED</option>
                                    <option value="UNQUALIFIED">UNQUALIFIED</option>
                                    <option value="CONVERTED" th:if="${leadId != null}">CONVERTED</option>
                                    <option value="LOST">LOST</option>
                                </select>
                                <div class="invalid-feedback">Lead status is mandatory and must come from a valid status set.</div>
                            </div>

                            <div class="col-md-6">
                                <label for="source" class="form-label">Source</label>
                                <input type="text" class="form-control" id="source" th:field="*{source}" placeholder="Web, Referral, Campaign, Trade Show...">
                            </div>

                            <div class="col-md-6">
                                <label for="expectedValue" class="form-label">Expected Value ($)</label>
                                <input type="number" step="0.01" min="0" class="form-control" id="expectedValue" th:field="*{expectedValue}" placeholder="5000.00">
                                <div class="invalid-feedback">Expected value must be within the configured numeric range.</div>
                                <div class="text-danger small" th:if="${#fields.hasErrors('expectedValue')}" th:errors="*{expectedValue}"></div>
                            </div>

                            <div class="col-md-6">
                                <label for="expectedCloseDate" class="form-label">Target Close Date</label>
                                <input type="date" class="form-control" id="expectedCloseDate" th:field="*{expectedCloseDate}">
                            </div>

                            <div class="col-md-6">
                                <label for="customerId" class="form-label">Associated Customer (Optional)</label>
                                <select class="form-select" id="customerId" th:field="*{customerId}">
                                    <option value="">-- None / Prospective --</option>
                                    <option th:each="c : ${customers}" th:value="${c.id}" th:text="${c.name} + ' (' + ${c.customerCode} + ')'"></option>
                                </select>
                            </div>

                            <div class="col-md-6" sec:authorize="hasAnyRole('ADMIN','MANAGER')">
                                <label for="assignedToId" class="form-label">Assign To Executive</label>
                                <select class="form-select" id="assignedToId" th:field="*{assignedToId}">
                                    <option value="">-- Select Sales Executive --</option>
                                    <option th:each="u : ${salesUsers}" th:value="${u.id}" th:text="${u.fullName}"></option>
                                </select>
                            </div>

                            <div class="col-12">
                                <label for="notes" class="form-label">Notes & Requirements</label>
                                <textarea class="form-control" id="notes" th:field="*{notes}" rows="3" placeholder="Requirement description, lead background..."></textarea>
                            </div>
                        </div>

                        <hr class="my-4">

                        <div class="d-flex justify-content-end gap-2">
                            <a th:href="@{/leads}" class="btn btn-outline-secondary">Cancel</a>
                            <button type="submit" class="btn btn-primary px-4 fw-semibold">
                                <i class="bi bi-save me-1"></i>Save Lead
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
