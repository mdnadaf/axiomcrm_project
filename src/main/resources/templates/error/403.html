<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>403 - Forbidden - AcxiomCRM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light d-flex align-items-center min-vh-100">
<div class="container text-center">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm border-0 p-5">
                <i class="bi bi-shield-x text-danger mb-3" style="font-size: 4rem;"></i>
                <h1 class="display-5 fw-bold text-danger">403</h1>
                <h4 class="mb-3">Access Denied</h4>
                <p class="text-muted mb-4" th:text="${message}">You do not have permission to view or manipulate this resource.</p>
                <div>
                    <a th:href="@{/dashboard}" class="btn btn-primary px-4 me-2">Dashboard</a>
                    <a href="javascript:history.back()" class="btn btn-outline-secondary px-4">Go Back</a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
