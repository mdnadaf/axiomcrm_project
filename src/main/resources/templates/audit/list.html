<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="en">
<head>
    <meta charset="UTF-8">
    <title>Audit Logs - AcxiomCRM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container-fluid px-4 flex-grow-1">
    <div th:replace="~{fragments/alerts :: alerts}"></div>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
            <h2 class="h3 fw-bold mb-0"><i class="bi bi-journal-text me-2"></i>Security & Business Audit Trail</h2>
            <p class="text-muted mb-0">Append-only compliance log of authentication and data modifications</p>
        </div>
        <div>
            <a th:href="@{/reports/audit/export}" class="btn btn-outline-success shadow-sm">
                <i class="bi bi-file-earmark-spreadsheet me-1"></i>Export CSV
            </a>
        </div>
    </div>

    <!-- Filters -->
    <div class="card mb-4 shadow-sm border-0">
        <div class="card-body">
            <form th:action="@{/audit}" method="get" class="row g-3 align-items-center">
                <div class="col-md-3">
                    <input type="text" name="entityName" class="form-control" placeholder="Entity (e.g. Customer, Lead)" th:value="${entityName}">
                </div>
                <div class="col-md-3">
                    <input type="text" name="action" class="form-control" placeholder="Action (e.g. CREATE, LOGIN_SUCCESS)" th:value="${action}">
                </div>
                <div class="col-md-3">
                    <input type="datetime-local" name="fromDate" class="form-control" th:value="${fromDate}">
                </div>
                <div class="col-md-3">
                    <button type="submit" class="btn btn-secondary w-100"><i class="bi bi-funnel me-1"></i>Filter Logs</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Audit Table -->
    <div class="card shadow-sm border-0">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0" style="font-size: 0.9rem;">
                <thead class="table-light">
                    <tr>
                        <th>Timestamp</th>
                        <th>User</th>
                        <th>Action</th>
                        <th>Entity</th>
                        <th>Record ID</th>
                        <th>Old Value</th>
                        <th>New Value</th>
                        <th>Client IP</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${logs.empty}">
                        <td colspan="8" class="text-center py-4 text-muted">No audit records found.</td>
                    </tr>
                    <tr th:each="l : ${logs.content}">
                        <td class="font-monospace text-muted" th:text="${#temporals.format(l.createdDate, 'yyyy-MM-dd HH:mm:ss')}">Timestamp</td>
                        <td class="fw-semibold" th:text="${l.username != null ? l.username : 'SYSTEM'}">Username</td>
                        <td>
                            <span class="badge" th:classappend="
                                ${l.action == 'CREATE'} ? 'bg-success' : (
                                ${l.action == 'UPDATE'} ? 'bg-primary' : (
                                ${l.action == 'DELETE'} ? 'bg-danger' : (
                                ${#strings.startsWith(l.action, 'LOGIN')} ? 'bg-info text-dark' : 'bg-secondary')))"
                                th:text="${l.action}">ACTION</span>
                        </td>
                        <td class="fw-bold" th:text="${l.entityName}">Entity</td>
                        <td class="font-monospace" th:text="${l.recordId != null ? l.recordId : '-'}">-</td>
                        <td class="text-truncate" style="max-width: 200px;" th:title="${l.oldValue}" th:text="${l.oldValue != null ? l.oldValue : '-'}">-</td>
                        <td class="text-truncate" style="max-width: 250px;" th:title="${l.newValue}" th:text="${l.newValue != null ? l.newValue : '-'}">-</td>
                        <td class="font-monospace text-muted small" th:text="${l.ipAddress != null ? l.ipAddress : '-'}">-</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div th:replace="~{fragments/pagination :: pagination(${logs}, '/audit')}"></div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
