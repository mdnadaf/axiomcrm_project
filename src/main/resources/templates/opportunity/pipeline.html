<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pipeline Kanban - AcxiomCRM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container-fluid px-4 flex-grow-1">
    <div th:replace="~{fragments/alerts :: alerts}"></div>

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="h3 fw-bold mb-0"><i class="bi bi-kanban me-2"></i>Sales Opportunity Pipeline</h2>
            <p class="text-muted mb-0">Visual stage progression for active pipeline</p>
        </div>
        <div>
            <a th:href="@{/opportunities}" class="btn btn-outline-secondary me-2">
                <i class="bi bi-table me-1"></i>Table View
            </a>
            <a th:href="@{/opportunities/new}" class="btn btn-primary shadow-sm">
                <i class="bi bi-plus-circle me-1"></i>New Opportunity
            </a>
        </div>
    </div>

    <!-- Kanban Stage Columns -->
    <div class="row g-3">
        <!-- Loop over stages -->
        <div class="col-lg" th:each="st : ${stages}">
            <div class="card shadow-sm h-100 border-0">
                <div class="card-header fw-bold text-center py-2" th:classappend="
                    ${st.name() == 'QUALIFICATION'} ? 'bg-info bg-opacity-25 text-dark' : (
                    ${st.name() == 'PROPOSAL'} ? 'bg-warning bg-opacity-25 text-dark' : (
                    ${st.name() == 'NEGOTIATION'} ? 'bg-primary bg-opacity-25 text-dark' : (
                    ${st.name() == 'WON'} ? 'bg-success bg-opacity-25 text-dark' : 'bg-danger bg-opacity-25 text-dark')))">
                    <span th:text="${st}">STAGE</span>
                </div>
                <div class="card-body p-2 bg-light" style="min-height: 480px;">
                    <!-- Opportunity card items in this stage -->
                    <div th:each="o : ${opportunities}" th:if="${o.stage == st}" class="card mb-2 shadow-sm border-0 kanban-item">
                        <div class="card-body p-3">
                            <a th:href="@{/opportunities/{id}(id=${o.id})}" class="fw-bold text-dark text-decoration-none d-block mb-1" th:text="${o.name}">Deal</a>
                            <div class="text-muted small mb-2"><i class="bi bi-building me-1"></i><span th:text="${o.customer.name}">Customer</span></div>
                            <div class="d-flex justify-content-between align-items-center">
                                <span class="fw-bold text-primary" th:text="'$' + ${#numbers.formatDecimal(o.amount, 0, 'COMMA', 0, 'POINT')}">$0</span>
                                <span class="badge bg-secondary" th:text="${o.probability} + '%'">0%</span>
                            </div>
                            <div class="text-muted small mt-1" style="font-size: 0.75rem;">
                                Close: <span th:text="${o.expectedCloseDate != null ? o.expectedCloseDate : 'TBD'}">Date</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
