<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="en">
<head>
    <meta charset="UTF-8">
    <title th:text="${opportunity.name} + ' - Opportunity Details - AcxiomCRM'">Opportunity Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container py-4 flex-grow-1">
    <div th:replace="~{fragments/alerts :: alerts}"></div>

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="h3 fw-bold mb-1" th:text="${opportunity.name}">Deal Name</h2>
            <span class="badge" th:classappend="
                ${opportunity.stage.name() == 'QUALIFICATION'} ? 'bg-info text-dark' : (
                ${opportunity.stage.name() == 'PROPOSAL'} ? 'bg-warning text-dark' : (
                ${opportunity.stage.name() == 'NEGOTIATION'} ? 'bg-primary' : (
                ${opportunity.stage.name() == 'WON'} ? 'bg-success' : 'bg-danger')))"
                th:text="${opportunity.stage}">QUALIFICATION</span>
            <span class="badge ms-1" th:classappend="
                ${opportunity.status.name() == 'OPEN'} ? 'bg-secondary' : (
                ${opportunity.status.name() == 'WON'} ? 'bg-success' : 'bg-danger')"
                th:text="${opportunity.status}">OPEN</span>
        </div>
        <div>
            <a th:href="@{/opportunities/{id}/edit(id=${opportunity.id})}" class="btn btn-outline-primary me-2">
                <i class="bi bi-pencil me-1"></i>Edit
            </a>
            <a th:href="@{/opportunities}" class="btn btn-outline-secondary">
                <i class="bi bi-arrow-left me-1"></i>Back
            </a>
        </div>
    </div>

    <!-- Details Grid -->
    <div class="row g-4 mb-4">
        <div class="col-md-6">
            <div class="card shadow-sm border-0 h-100">
                <div class="card-header bg-white fw-bold"><i class="bi bi-currency-dollar me-2 text-primary"></i>Deal Value & Financials</div>
                <div class="card-body">
                    <dl class="row mb-0">
                        <dt class="col-sm-5 text-muted">Amount:</dt>
                        <dd class="col-sm-7 fw-bold fs-5 text-dark" th:text="'$' + ${#numbers.formatDecimal(opportunity.amount, 0, 'COMMA', 2, 'POINT')}">$0.00</dd>

                        <dt class="col-sm-5 text-muted">Win Probability:</dt>
                        <dd class="col-sm-7" th:text="${opportunity.probability} + '%'">0%</dd>

                        <dt class="col-sm-5 text-muted">Weighted Pipeline:</dt>
                        <dd class="col-sm-7 fw-bold text-success" th:text="'$' + ${#numbers.formatDecimal(opportunity.weightedValue, 0, 'COMMA', 2, 'POINT')}">$0.00</dd>

                        <dt class="col-sm-5 text-muted">Expected Close Date:</dt>
                        <dd class="col-sm-7" th:text="${opportunity.expectedCloseDate != null ? opportunity.expectedCloseDate : '-'}">-</dd>
                    </dl>
                </div>
            </div>
        </div>

        <div class="col-md-6">
            <div class="card shadow-sm border-0 h-100">
                <div class="card-header bg-white fw-bold"><i class="bi bi-building me-2 text-primary"></i>Associated Customer & Owner</div>
                <div class="card-body">
                    <dl class="row mb-0">
                        <dt class="col-sm-4 text-muted">Customer:</dt>
                        <dd class="col-sm-8">
                            <a th:href="@{/customers/{id}(id=${opportunity.customer.id})}" th:text="${opportunity.customer.name}" class="fw-bold text-decoration-none">Acme Corp</a>
                        </dd>

                        <dt class="col-sm-4 text-muted">Lead:</dt>
                        <dd class="col-sm-8">
                            <span th:if="${opportunity.lead != null}">
                                <a th:href="@{/leads/{id}(id=${opportunity.lead.id})}" th:text="${opportunity.lead.name}" class="text-decoration-none">Lead</a>
                            </span>
                            <span th:if="${opportunity.lead == null}" class="text-muted">None</span>
                        </dd>

                        <dt class="col-sm-4 text-muted">Owner:</dt>
                        <dd class="col-sm-8" th:text="${opportunity.assignedTo != null ? opportunity.assignedTo.fullName : 'Unassigned'}">Sales</dd>

                        <dt class="col-sm-4 text-muted">Created Date:</dt>
                        <dd class="col-sm-8" th:text="${#temporals.format(opportunity.createdDate, 'yyyy-MM-dd HH:mm')}">-</dd>

                        <dt class="col-sm-4 text-muted">Description:</dt>
                        <dd class="col-sm-8" th:text="${opportunity.description != null ? opportunity.description : '-'}">-</dd>
                    </dl>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
