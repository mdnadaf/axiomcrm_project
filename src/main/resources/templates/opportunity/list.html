<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="en">
<head>
    <meta charset="UTF-8">
    <title>Opportunities - AcxiomCRM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container-fluid px-4 flex-grow-1">
    <div th:replace="~{fragments/alerts :: alerts}"></div>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="h3 fw-bold mb-0"><i class="bi bi-briefcase me-2"></i>Opportunities</h2>
        <div>
            <a th:href="@{/opportunities/pipeline}" class="btn btn-outline-primary me-2 shadow-sm">
                <i class="bi bi-kanban me-1"></i>Pipeline Kanban
            </a>
            <a th:href="@{/opportunities/new}" class="btn btn-primary shadow-sm">
                <i class="bi bi-plus-circle me-1"></i>New Opportunity
            </a>
        </div>
    </div>

    <!-- Filters -->
    <div class="card mb-4 shadow-sm border-0">
        <div class="card-body">
            <form th:action="@{/opportunities}" method="get" class="row g-3 align-items-center">
                <div class="col-md-4">
                    <input type="text" name="search" class="form-control" placeholder="Search opportunity name..." th:value="${search}">
                </div>
                <div class="col-md-3">
                    <select name="stage" class="form-select">
                        <option value="">All Stages</option>
                        <option th:each="st : ${stages}" th:value="${st}" th:text="${st}" th:selected="${selectedStage == st}"></option>
                    </select>
                </div>
                <div class="col-md-3">
                    <select name="status" class="form-select">
                        <option value="">All Statuses</option>
                        <option th:each="st : ${statuses}" th:value="${st}" th:text="${st}" th:selected="${selectedStatus == st}"></option>
                    </select>
                </div>
                <div class="col-md-2">
                    <button type="submit" class="btn btn-secondary w-100"><i class="bi bi-funnel me-1"></i>Filter</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Opportunities Table -->
    <div class="card shadow-sm border-0">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                    <tr>
                        <th>Deal Name</th>
                        <th>Customer</th>
                        <th>Stage</th>
                        <th>Status</th>
                        <th>Amount</th>
                        <th>Prob %</th>
                        <th>Weighted Value</th>
                        <th>Close Date</th>
                        <th>Owner</th>
                        <th class="text-end">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${opportunities.empty}">
                        <td colspan="10" class="text-center py-4 text-muted">No opportunity records found.</td>
                    </tr>
                    <tr th:each="o : ${opportunities.content}">
                        <td>
                            <a th:href="@{/opportunities/{id}(id=${o.id})}" class="fw-bold text-decoration-none text-primary" th:text="${o.name}">Deal</a>
                        </td>
                        <td>
                            <a th:if="${o.customer != null}" th:href="@{/customers/{id}(id=${o.customer.id})}" th:text="${o.customer.name}" class="text-decoration-none">Cust</a>
                            <span th:if="${o.customer == null}">-</span>
                        </td>
                        <td>
                            <span class="badge" th:classappend="
                                ${o.stage.name() == 'QUALIFICATION'} ? 'bg-info text-dark' : (
                                ${o.stage.name() == 'PROPOSAL'} ? 'bg-warning text-dark' : (
                                ${o.stage.name() == 'NEGOTIATION'} ? 'bg-primary' : (
                                ${o.stage.name() == 'WON'} ? 'bg-success' : 'bg-danger')))"
                                th:text="${o.stage}">QUALIFICATION</span>
                        </td>
                        <td>
                            <span class="badge" th:classappend="
                                ${o.status.name() == 'OPEN'} ? 'bg-secondary' : (
                                ${o.status.name() == 'WON'} ? 'bg-success' : 'bg-danger')"
                                th:text="${o.status}">OPEN</span>
                        </td>
                        <td class="fw-bold text-dark" th:text="'$' + ${#numbers.formatDecimal(o.amount, 0, 'COMMA', 2, 'POINT')}">$0.00</td>
                        <td th:text="${o.probability} + '%'">0%</td>
                        <td class="text-success" th:text="'$' + ${#numbers.formatDecimal(o.weightedValue, 0, 'COMMA', 2, 'POINT')}">$0.00</td>
                        <td th:text="${o.expectedCloseDate}">2026-12-01</td>
                        <td th:text="${o.assignedTo != null ? o.assignedTo.fullName : 'Unassigned'}">Owner</td>
                        <td class="text-end">
                            <a th:href="@{/opportunities/{id}(id=${o.id})}" class="btn btn-sm btn-outline-info me-1" title="View"><i class="bi bi-eye"></i></a>
                            <a th:href="@{/opportunities/{id}/edit(id=${o.id})}" class="btn btn-sm btn-outline-primary me-1" title="Edit"><i class="bi bi-pencil"></i></a>
                            <button type="button" class="btn btn-sm btn-outline-danger" sec:authorize="hasAnyRole('ADMIN','MANAGER')"
                                    data-bs-toggle="modal" th:data-bs-target="'#deleteModal' + ${o.id}" title="Delete">
                                <i class="bi bi-trash"></i>
                            </button>

                            <div class="modal fade text-start" th:id="'deleteModal' + ${o.id}" tabindex="-1" aria-hidden="true">
                                <div class="modal-dialog">
                                    <div class="modal-content">
                                        <div class="modal-header">
                                            <h5 class="modal-title">Confirm Delete</h5>
                                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                                        </div>
                                        <div class="modal-body">
                                            Are you sure you want to delete opportunity <strong th:text="${o.name}"></strong>?
                                        </div>
                                        <div class="modal-footer">
                                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                                            <form th:action="@{/opportunities/{id}/delete(id=${o.id})}" method="post">
                                                <button type="submit" class="btn btn-danger">Delete</button>
                                            </form>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Pagination -->
    <div th:replace="~{fragments/pagination :: pagination(${opportunities}, '/opportunities')}"></div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
