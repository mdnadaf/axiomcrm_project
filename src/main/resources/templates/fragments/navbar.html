<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm mb-4">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" th:href="@{/dashboard}">
            <i class="bi bi-building me-1"></i>AcxiomCRM
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent"
                aria-controls="navbarContent" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0" sec:authorize="isAuthenticated()">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/dashboard}"><i class="bi bi-speedometer2 me-1"></i>Dashboard</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/customers}"><i class="bi bi-people me-1"></i>Customers</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/leads}"><i class="bi bi-funnel me-1"></i>Leads</a>
                </li>
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" id="oppsDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                        <i class="bi bi-briefcase me-1"></i>Opportunities
                    </a>
                    <ul class="dropdown-menu" aria-labelledby="oppsDropdown">
                        <li><a class="dropdown-item" th:href="@{/opportunities}">All Opportunities</a></li>
                        <li><a class="dropdown-item" th:href="@{/opportunities/pipeline}">Pipeline Kanban</a></li>
                    </ul>
                </li>
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" id="fuDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                        <i class="bi bi-calendar-check me-1"></i>Follow-Ups
                    </a>
                    <ul class="dropdown-menu" aria-labelledby="fuDropdown">
                        <li><a class="dropdown-item" th:href="@{/followups}">All Follow-Ups</a></li>
                        <li><a class="dropdown-item" th:href="@{/followups/pending}">Pending</a></li>
                        <li><a class="dropdown-item" th:href="@{/followups/overdue}">Overdue</a></li>
                    </ul>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/activities}"><i class="bi bi-clock-history me-1"></i>Activities</a>
                </li>
                <li class="nav-item" sec:authorize="hasAnyRole('ADMIN','MANAGER')">
                    <a class="nav-link" th:href="@{/reports}"><i class="bi bi-graph-up me-1"></i>Reports</a>
                </li>
                <li class="nav-item" sec:authorize="hasAnyRole('ADMIN','MANAGER')">
                    <a class="nav-link" th:href="@{/admin/users}"><i class="bi bi-person-gear me-1"></i>Users</a>
                </li>
                <li class="nav-item" sec:authorize="hasAnyRole('ADMIN','MANAGER')">
                    <a class="nav-link" th:href="@{/audit}"><i class="bi bi-journal-text me-1"></i>Audit Logs</a>
                </li>
            </ul>

            <ul class="navbar-nav ms-auto mb-2 mb-lg-0" sec:authorize="isAuthenticated()">
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle active fw-semibold" href="#" id="userDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                        <i class="bi bi-person-circle me-1"></i>
                        <span sec:authentication="name">User</span>
                        <span class="badge bg-light text-primary ms-1" sec:authentication="principal.role">ROLE</span>
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end shadow" aria-labelledby="userDropdown">
                        <li>
                            <form th:action="@{/logout}" method="post" class="d-inline">
                                <button type="submit" class="dropdown-item text-danger">
                                    <i class="bi bi-box-arrow-right me-2"></i>Sign Out
                                </button>
                            </form>
                        </li>
                    </ul>
                </li>
            </ul>

            <ul class="navbar-nav ms-auto" sec:authorize="isAnonymous()">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/login}"><i class="bi bi-box-arrow-in-right me-1"></i>Sign In</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/register}"><i class="bi bi-person-plus me-1"></i>Register</a>
                </li>
            </ul>
        </div>
    </div>
</nav>
</body>
</html>
