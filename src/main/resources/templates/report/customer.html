<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Customer Report - AcxiomCRM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container-fluid px-4 flex-grow-1">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="h3 fw-bold mb-0"><i class="bi bi-people me-2"></i>Customer Report</h2>
        <div>
            <a th:href="@{/reports/customers/export}" class="btn btn-outline-success me-2"><i class="bi bi-file-earmark-spreadsheet me-1"></i>Export CSV</a>
            <a th:href="@{/reports}" class="btn btn-outline-secondary"><i class="bi bi-arrow-left me-1"></i>Reports Menu</a>
        </div>
    </div>

    <div class="card mb-4 shadow-sm border-0">
        <div class="card-body">
            <form th:action="@{/reports/customers}" method="get" class="row g-3 align-items-center">
                <div class="col-md-6">
                    <input type="text" name="search" class="form-control" placeholder="Search customer name..." th:value="${search}">
                </div>
                <div class="col-md-4">
                    <select name="active" class="form-select">
                        <option value="">All Statuses</option>
                        <option value="true" th:selected="${active == true}">Active</option>
                        <option value="false" th:selected="${active == false}">Inactive</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <button type="submit" class="btn btn-secondary w-100">Filter</button>
                </div>
            </form>
        </div>
    </div>

    <div class="card shadow-sm border-0">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                    <tr>
                        <th>Code</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Phone</th>
                        <th>Company</th>
                        <th>Status</th>
                        <th>Owner</th>
                        <th>Created Date</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${customers.empty}"><td colspan="8" class="text-center py-3 text-muted">No records.</td></tr>
                    <tr th:each="c : ${customers.content}">
                        <td th:text="${c.customerCode}">CUST-0001</td>
                        <td class="fw-bold"><a th:href="@{/customers/{id}(id=${c.id})}" th:text="${c.name}" class="text-decoration-none">Name</a></td>
                        <td th:text="${c.email}">email</td>
                        <td th:text="${c.phone}">phone</td>
                        <td th:text="${c.company != null ? c.company : '-'}">-</td>
                        <td><span class="badge" th:classappend="${c.active} ? 'bg-success' : 'bg-danger'" th:text="${c.active} ? 'Active' : 'Inactive'">Active</span></td>
                        <td th:text="${c.assignedTo != null ? c.assignedTo.fullName : 'Unassigned'}">Owner</td>
                        <td th:text="${#temporals.format(c.createdDate, 'yyyy-MM-dd')}">Date</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
    <div th:replace="~{fragments/pagination :: pagination(${customers}, '/reports/customers')}"></div>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
