<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Lead Report - AcxiomCRM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container-fluid px-4 flex-grow-1">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="h3 fw-bold mb-0"><i class="bi bi-funnel me-2"></i>Lead Report</h2>
        <div>
            <a th:href="@{/reports/leads/export}" class="btn btn-outline-success me-2"><i class="bi bi-file-earmark-spreadsheet me-1"></i>Export CSV</a>
            <a th:href="@{/reports}" class="btn btn-outline-secondary"><i class="bi bi-arrow-left me-1"></i>Reports Menu</a>
        </div>
    </div>

    <div class="card mb-4 shadow-sm border-0">
        <div class="card-body">
            <form th:action="@{/reports/leads}" method="get" class="row g-3 align-items-center">
                <div class="col-md-6">
                    <input type="text" name="search" class="form-control" placeholder="Search lead name..." th:value="${search}">
                </div>
                <div class="col-md-4">
                    <select name="status" class="form-select">
                        <option value="">All Statuses</option>
                        <option th:each="st : ${statuses}" th:value="${st}" th:text="${st}" th:selected="${selectedStatus == st}"></option>
                    </select>
                </div>
                <div class="col-md-2">
                    <button type="submit" class="btn btn-secondary w-100">Filter</button>
                </div>
            </form>
        </div>
    </div>

    <div class="card shadow-sm border-0">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                    <tr>
                        <th>Code</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Status</th>
                        <th>Source</th>
                        <th>Expected Value</th>
                        <th>Owner</th>
                        <th>Created Date</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${leads.empty}"><td colspan="8" class="text-center py-3 text-muted">No records.</td></tr>
                    <tr th:each="l : ${leads.content}">
                        <td th:text="${l.leadCode}">LEAD-0001</td>
                        <td class="fw-bold"><a th:href="@{/leads/{id}(id=${l.id})}" th:text="${l.name}" class="text-decoration-none">Name</a></td>
                        <td th:text="${l.email}">email</td>
                        <td><span class="badge bg-primary" th:text="${l.status}">STATUS</span></td>
                        <td th:text="${l.source != null ? l.source : '-'}">-</td>
                        <td th:text="${l.expectedValue != null ? '$' + l.expectedValue : '$0.00'}">$0</td>
                        <td th:text="${l.assignedTo != null ? l.assignedTo.fullName : 'Unassigned'}">Owner</td>
                        <td th:text="${#temporals.format(l.createdDate, 'yyyy-MM-dd')}">Date</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
    <div th:replace="~{fragments/pagination :: pagination(${leads}, '/reports/leads')}"></div>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
