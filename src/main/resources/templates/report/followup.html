<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Follow-Up Report - AcxiomCRM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container-fluid px-4 flex-grow-1">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="h3 fw-bold mb-0"><i class="bi bi-calendar-check me-2"></i>Follow-Up Report</h2>
        <div>
            <a th:href="@{/reports/followups/export}" class="btn btn-outline-success me-2"><i class="bi bi-file-earmark-spreadsheet me-1"></i>Export CSV</a>
            <a th:href="@{/reports}" class="btn btn-outline-secondary"><i class="bi bi-arrow-left me-1"></i>Reports Menu</a>
        </div>
    </div>

    <div class="card mb-4 shadow-sm border-0">
        <div class="card-body">
            <form th:action="@{/reports/followups}" method="get" class="row g-3 align-items-center">
                <div class="col-md-3">
                    <select name="status" class="form-select">
                        <option value="">All Statuses</option>
                        <option th:each="st : ${statuses}" th:value="${st}" th:text="${st}" th:selected="${selectedStatus == st}"></option>
                    </select>
                </div>
                <div class="col-md-3">
                    <input type="date" name="fromDate" class="form-control" th:value="${fromDate}">
                </div>
                <div class="col-md-3">
                    <input type="date" name="toDate" class="form-control" th:value="${toDate}">
                </div>
                <div class="col-md-3">
                    <button type="submit" class="btn btn-secondary w-100">Filter</button>
                </div>
            </form>
        </div>
    </div>

    <div class="card shadow-sm border-0">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                    <tr>
                        <th>Date</th>
                        <th>Type</th>
                        <th>Remarks</th>
                        <th>Status</th>
                        <th>Assigned To</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${followups.empty}"><td colspan="5" class="text-center py-3 text-muted">No records.</td></tr>
                    <tr th:each="f : ${followups.content}">
                        <td th:text="${f.followUpDate}">2026-11-25</td>
                        <td><span class="badge bg-light text-dark border" th:text="${f.type}">CALL</span></td>
                        <td th:text="${f.remarks != null ? f.remarks : '-'}">-</td>
                        <td><span class="badge bg-secondary" th:text="${f.status}">STATUS</span></td>
                        <td th:text="${f.assignedTo != null ? f.assignedTo.fullName : 'Unassigned'}">Owner</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
    <div th:replace="~{fragments/pagination :: pagination(${followups}, '/reports/followups')}"></div>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
