<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Conversion Report - AcxiomCRM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container-fluid px-4 flex-grow-1">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="h3 fw-bold mb-0"><i class="bi bi-arrow-repeat me-2"></i>Lead Conversion Analytics</h2>
            <p class="text-muted mb-0">Analysis of converted prospective leads into active customer accounts</p>
        </div>
        <div>
            <a th:href="@{/reports}" class="btn btn-outline-secondary"><i class="bi bi-arrow-left me-1"></i>Reports Menu</a>
        </div>
    </div>

    <div class="row g-4">
        <div class="col-md-4">
            <div class="card shadow-sm border-0 text-center p-4">
                <div class="text-muted text-uppercase fw-bold small">Total Leads Captured</div>
                <div class="display-5 fw-bold text-primary mt-2" th:text="${report.totalLeads}">0</div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card shadow-sm border-0 text-center p-4">
                <div class="text-muted text-uppercase fw-bold small">Successfully Converted</div>
                <div class="display-5 fw-bold text-success mt-2" th:text="${report.convertedLeads}">0</div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card shadow-sm border-0 text-center p-4">
                <div class="text-muted text-uppercase fw-bold small">Conversion Rate</div>
                <div class="display-5 fw-bold text-info mt-2" th:text="${report.conversionRate} + '%'">0%</div>
            </div>
        </div>
    </div>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
