<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Opportunity Report - AcxiomCRM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container-fluid px-4 flex-grow-1">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="h3 fw-bold mb-0"><i class="bi bi-briefcase me-2"></i>Opportunity Report</h2>
        <div>
            <a th:href="@{/reports/opportunities/export}" class="btn btn-outline-success me-2"><i class="bi bi-file-earmark-spreadsheet me-1"></i>Export CSV</a>
            <a th:href="@{/reports}" class="btn btn-outline-secondary"><i class="bi bi-arrow-left me-1"></i>Reports Menu</a>
        </div>
    </div>

    <div class="card mb-4 shadow-sm border-0">
        <div class="card-body">
            <form th:action="@{/reports/opportunities}" method="get" class="row g-3 align-items-center">
                <div class="col-md-4">
                    <input type="text" name="search" class="form-control" placeholder="Search opportunity name..." th:value="${search}">
                </div>
                <div class="col-md-3">
                    <select name="stage" class="form-select">
                        <option value="">All Stages</option>
                        <option th:each="st : ${stages}" th:value="${st}" th:text="${st}" th:selected="${selectedStage == st}"></option>
                    </select>
                </div>
                <div class="col-md-3">
                    <select name="status" class="form-select">
                        <option value="">All Statuses</option>
                        <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}" th:selected="${selectedStatus == s}"></option>
                    </select>
                </div>
                <div class="col-md-2">
                    <button type="submit" class="btn btn-secondary w-100">Filter</button>
                </div>
            </form>
        </div>
    </div>

    <div class="card shadow-sm border-0">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                    <tr>
                        <th>Deal Name</th>
                        <th>Customer</th>
                        <th>Stage</th>
                        <th>Status</th>
                        <th>Amount</th>
                        <th>Prob %</th>
                        <th>Weighted Value</th>
                        <th>Close Date</th>
                        <th>Owner</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${opportunities.empty}"><td colspan="9" class="text-center py-3 text-muted">No records.</td></tr>
                    <tr th:each="o : ${opportunities.content}">
                        <td class="fw-bold"><a th:href="@{/opportunities/{id}(id=${o.id})}" th:text="${o.name}" class="text-decoration-none">Deal</a></td>
                        <td th:text="${o.customer != null ? o.customer.name : '-'}">-</td>
                        <td><span class="badge bg-info text-dark" th:text="${o.stage}">STAGE</span></td>
                        <td><span class="badge bg-secondary" th:text="${o.status}">STATUS</span></td>
                        <td class="fw-bold" th:text="'$' + ${#numbers.formatDecimal(o.amount, 0, 'COMMA', 2, 'POINT')}">$0</td>
                        <td th:text="${o.probability} + '%'">0%</td>
                        <td class="text-success" th:text="'$' + ${#numbers.formatDecimal(o.weightedValue, 0, 'COMMA', 2, 'POINT')}">$0</td>
                        <td th:text="${o.expectedCloseDate}">Close</td>
                        <td th:text="${o.assignedTo != null ? o.assignedTo.fullName : 'Unassigned'}">Owner</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
    <div th:replace="~{fragments/pagination :: pagination(${opportunities}, '/reports/opportunities')}"></div>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
