<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>User Activity Report - AcxiomCRM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container-fluid px-4 flex-grow-1">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="h3 fw-bold mb-0"><i class="bi bi-clock-history me-2"></i>User Activity Report</h2>
        <div>
            <a th:href="@{/reports/user-activity/export}" class="btn btn-outline-success me-2"><i class="bi bi-file-earmark-spreadsheet me-1"></i>Export CSV</a>
            <a th:href="@{/reports}" class="btn btn-outline-secondary"><i class="bi bi-arrow-left me-1"></i>Reports Menu</a>
        </div>
    </div>

    <div class="card shadow-sm border-0">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                    <tr>
                        <th>Date</th>
                        <th>Type</th>
                        <th>Subject</th>
                        <th>Status</th>
                        <th>Owner</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${activities.empty}"><td colspan="5" class="text-center py-3 text-muted">No activity records.</td></tr>
                    <tr th:each="a : ${activities.content}">
                        <td th:text="${#temporals.format(a.activityDate, 'yyyy-MM-dd HH:mm')}">Date</td>
                        <td><span class="badge bg-secondary" th:text="${a.type}">CALL</span></td>
                        <td th:text="${a.subject}">Subject</td>
                        <td><span class="badge bg-info text-dark" th:text="${a.status}">STATUS</span></td>
                        <td th:text="${a.assignedTo != null ? a.assignedTo.fullName : 'Unassigned'}">Owner</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
    <div th:replace="~{fragments/pagination :: pagination(${activities}, '/reports/user-activity')}"></div>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
