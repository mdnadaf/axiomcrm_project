<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Account Locked - AcxiomCRM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light d-flex align-items-center min-vh-100">
<div class="container text-center">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm border-0 p-5">
                <div class="mb-3">
                    <i class="bi bi-lock-fill text-warning" style="font-size: 4rem;"></i>
                </div>
                <h2 class="mb-3">Account Temporarily Locked</h2>
                <p class="text-muted mb-4">Your account has been locked after 5 consecutive failed login attempts in accordance with the security policy. Please wait 15 minutes or contact a CRM administrator to unlock your account immediately.</p>
                <div>
                    <a th:href="@{/login}" class="btn btn-primary px-4">
                        <i class="bi bi-arrow-left me-1"></i>Back to Sign In
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
