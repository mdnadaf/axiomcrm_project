<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Access Denied - AcxiomCRM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light d-flex align-items-center min-vh-100">
<div class="container text-center">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm border-0 p-5">
                <div class="mb-3">
                    <i class="bi bi-shield-lock-fill text-danger" style="font-size: 4rem;"></i>
                </div>
                <h1 class="display-5 fw-bold text-danger">403</h1>
                <h3 class="mb-3">Access Denied</h3>
                <p class="text-muted mb-4">You do not have permission to access this resource or record. Scope rules restrict view access to assigned records.</p>
                <div>
                    <a th:href="@{/dashboard}" class="btn btn-primary px-4 me-2">
                        <i class="bi bi-house me-1"></i>Back to Dashboard
                    </a>
                    <a href="javascript:history.back()" class="btn btn-outline-secondary px-4">
                        <i class="bi bi-arrow-left me-1"></i>Go Back
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
