<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="en">
<head>
    <meta charset="UTF-8">
    <title>Activity Details - AcxiomCRM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container py-4 flex-grow-1">
    <div th:replace="~{fragments/alerts :: alerts}"></div>

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="h3 fw-bold mb-1" th:text="${activity.subject}">Subject</h2>
            <span class="badge bg-secondary font-monospace me-2" th:text="${activity.type}">CALL</span>
            <span class="badge" th:classappend="
                ${activity.status.name() == 'COMPLETED'} ? 'bg-success' : (
                ${activity.status.name() == 'PENDING'} ? 'bg-warning text-dark' : 'bg-info text-dark')"
                th:text="${activity.status}">PENDING</span>
        </div>
        <div>
            <a th:href="@{/activities/{id}/edit(id=${activity.id})}" class="btn btn-outline-primary me-2"><i class="bi bi-pencil me-1"></i>Edit</a>
            <a th:href="@{/activities}" class="btn btn-outline-secondary"><i class="bi bi-arrow-left me-1"></i>Back</a>
        </div>
    </div>

    <div class="card shadow-sm border-0 mb-4">
        <div class="card-body">
            <dl class="row mb-0">
                <dt class="col-sm-3 text-muted">Activity Date & Time:</dt>
                <dd class="col-sm-9 fw-bold" th:text="${#temporals.format(activity.activityDate, 'yyyy-MM-dd HH:mm')}">-</dd>

                <dt class="col-sm-3 text-muted">Associated Customer:</dt>
                <dd class="col-sm-9">
                    <span th:if="${activity.customer != null}"><a th:href="@{/customers/{id}(id=${activity.customer.id})}" th:text="${activity.customer.name}" class="fw-bold text-decoration-none">Customer</a></span>
                    <span th:if="${activity.customer == null}" class="text-muted">None</span>
                </dd>

                <dt class="col-sm-3 text-muted">Associated Lead:</dt>
                <dd class="col-sm-9">
                    <span th:if="${activity.lead != null}"><a th:href="@{/leads/{id}(id=${activity.lead.id})}" th:text="${activity.lead.name}" class="fw-bold text-decoration-none">Lead</a></span>
                    <span th:if="${activity.lead == null}" class="text-muted">None</span>
                </dd>

                <dt class="col-sm-3 text-muted">Owner / Assigned To:</dt>
                <dd class="col-sm-9" th:text="${activity.assignedTo != null ? activity.assignedTo.fullName : 'Unassigned'}">Sales</dd>

                <dt class="col-sm-3 text-muted">Description / Notes:</dt>
                <dd class="col-sm-9" th:text="${activity.description != null ? activity.description : '-'}">-</dd>
            </dl>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
