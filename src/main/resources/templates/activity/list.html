<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="en">
<head>
    <meta charset="UTF-8">
    <title>Activities - AcxiomCRM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container-fluid px-4 flex-grow-1">
    <div th:replace="~{fragments/alerts :: alerts}"></div>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="h3 fw-bold mb-0"><i class="bi bi-clock-history me-2"></i>Activities</h2>
        <a th:href="@{/activities/new}" class="btn btn-primary shadow-sm">
            <i class="bi bi-plus-circle me-1"></i>New Activity
        </a>
    </div>

    <!-- Filters -->
    <div class="card mb-4 shadow-sm border-0">
        <div class="card-body">
            <form th:action="@{/activities}" method="get" class="row g-3 align-items-center">
                <div class="col-md-4">
                    <select name="type" class="form-select">
                        <option value="">All Activity Types</option>
                        <option th:each="t : ${types}" th:value="${t}" th:text="${t}" th:selected="${selectedType == t}"></option>
                    </select>
                </div>
                <div class="col-md-4">
                    <select name="status" class="form-select">
                        <option value="">All Statuses</option>
                        <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}" th:selected="${selectedStatus == s}"></option>
                    </select>
                </div>
                <div class="col-md-4">
                    <button type="submit" class="btn btn-secondary w-100"><i class="bi bi-funnel me-1"></i>Filter</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Table -->
    <div class="card shadow-sm border-0">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                    <tr>
                        <th>Date & Time</th>
                        <th>Type</th>
                        <th>Subject</th>
                        <th>Related Record</th>
                        <th>Status</th>
                        <th>Assigned To</th>
                        <th class="text-end">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${activities.empty}">
                        <td colspan="7" class="text-center py-4 text-muted">No activity records found.</td>
                    </tr>
                    <tr th:each="a : ${activities.content}">
                        <td class="fw-bold" th:text="${#temporals.format(a.activityDate, 'yyyy-MM-dd HH:mm')}">Date</td>
                        <td><span class="badge bg-secondary font-monospace" th:text="${a.type}">CALL</span></td>
                        <td><a th:href="@{/activities/{id}(id=${a.id})}" class="fw-bold text-decoration-none text-dark" th:text="${a.subject}">Subject</a></td>
                        <td>
                            <span th:if="${a.customer != null}"><i class="bi bi-person me-1"></i><a th:href="@{/customers/{id}(id=${a.customer.id})}" th:text="${a.customer.name}" class="text-decoration-none">Cust</a></span>
                            <span th:if="${a.lead != null}"><i class="bi bi-funnel me-1"></i><a th:href="@{/leads/{id}(id=${a.lead.id})}" th:text="${a.lead.name}" class="text-decoration-none">Lead</a></span>
                        </td>
                        <td>
                            <span class="badge" th:classappend="
                                ${a.status.name() == 'COMPLETED'} ? 'bg-success' : (
                                ${a.status.name() == 'PENDING'} ? 'bg-warning text-dark' : 'bg-info text-dark')"
                                th:text="${a.status}">PENDING</span>
                        </td>
                        <td th:text="${a.assignedTo != null ? a.assignedTo.fullName : 'Unassigned'}">User</td>
                        <td class="text-end">
                            <a th:href="@{/activities/{id}(id=${a.id})}" class="btn btn-sm btn-outline-info me-1"><i class="bi bi-eye"></i></a>
                            <a th:href="@{/activities/{id}/edit(id=${a.id})}" class="btn btn-sm btn-outline-primary me-1"><i class="bi bi-pencil"></i></a>
                            <button type="button" class="btn btn-sm btn-outline-danger" sec:authorize="hasAnyRole('ADMIN','MANAGER')"
                                    data-bs-toggle="modal" th:data-bs-target="'#deleteModal' + ${a.id}">
                                <i class="bi bi-trash"></i>
                            </button>

                            <div class="modal fade text-start" th:id="'deleteModal' + ${a.id}" tabindex="-1" aria-hidden="true">
                                <div class="modal-dialog">
                                    <div class="modal-content">
                                        <div class="modal-header">
                                            <h5 class="modal-title">Confirm Delete</h5>
                                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                                        </div>
                                        <div class="modal-body">
                                            Delete activity <strong th:text="${a.subject}"></strong>?
                                        </div>
                                        <div class="modal-footer">
                                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                                            <form th:action="@{/activities/{id}/delete(id=${a.id})}" method="post">
                                                <button type="submit" class="btn btn-danger">Delete</button>
                                            </form>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div th:replace="~{fragments/pagination :: pagination(${activities}, '/activities')}"></div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
