<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="en">
<head>
    <meta charset="UTF-8">
    <title th:text="${activityId != null ? 'Edit Activity' : 'New Activity'} + ' - AcxiomCRM'">Activity Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container py-4 flex-grow-1">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-white py-3">
                    <h4 class="mb-0 fw-bold" th:text="${activityId != null ? 'Edit Activity' : 'Record New Activity'}">Activity Form</h4>
                </div>
                <div class="card-body p-4">
                    <form th:action="${activityId != null ? '/activities/' + activityId + '/edit' : '/activities'}"
                          th:object="${activityForm}" method="post" class="needs-validation" novalidate>

                        <div class="row g-3">
                            <div class="col-md-6">
                                <label for="type" class="form-label">Activity Type <span class="text-danger">*</span></label>
                                <select class="form-select" id="type" th:field="*{type}" required>
                                    <option th:each="t : ${types}" th:value="${t}" th:text="${t}"></option>
                                </select>
                            </div>

                            <div class="col-md-6">
                                <label for="activityDate" class="form-label">Date & Time <span class="text-danger">*</span></label>
                                <input type="datetime-local" class="form-control" id="activityDate" th:field="*{activityDate}" required>
                                <div class="invalid-feedback">Activity date and time is required.</div>
                            </div>

                            <div class="col-12">
                                <label for="subject" class="form-label">Subject <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="subject" th:field="*{subject}" required placeholder="Project Kickoff Call">
                                <div class="invalid-feedback">Subject is required.</div>
                                <div class="text-danger small" th:if="${#fields.hasErrors('subject')}" th:errors="*{subject}"></div>
                            </div>

                            <div class="col-md-6">
                                <label for="status" class="form-label">Status <span class="text-danger">*</span></label>
                                <select class="form-select" id="status" th:field="*{status}" required>
                                    <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}"></option>
                                </select>
                            </div>

                            <div class="col-md-6" sec:authorize="hasAnyRole('ADMIN','MANAGER')">
                                <label for="assignedToId" class="form-label">Assigned Executive</label>
                                <select class="form-select" id="assignedToId" th:field="*{assignedToId}">
                                    <option value="">-- Select Executive --</option>
                                    <option th:each="u : ${salesUsers}" th:value="${u.id}" th:text="${u.fullName}"></option>
                                </select>
                            </div>

                            <div class="col-md-6">
                                <label for="customerId" class="form-label">Customer (Optional)</label>
                                <select class="form-select" id="customerId" th:field="*{customerId}">
                                    <option value="">-- None --</option>
                                    <option th:each="c : ${customers}" th:value="${c.id}" th:text="${c.name} + ' (' + ${c.customerCode} + ')'"></option>
                                </select>
                            </div>

                            <div class="col-md-6">
                                <label for="leadId" class="form-label">Lead (Optional)</label>
                                <select class="form-select" id="leadId" th:field="*{leadId}">
                                    <option value="">-- None --</option>
                                    <option th:each="l : ${leads}" th:value="${l.id}" th:text="${l.name} + ' (' + ${l.leadCode} + ')'"></option>
                                </select>
                            </div>

                            <div class="col-12">
                                <label for="description" class="form-label">Activity Description</label>
                                <textarea class="form-control" id="description" th:field="*{description}" rows="4" placeholder="Detailed notes, discussion topics, outcomes..."></textarea>
                            </div>
                        </div>

                        <hr class="my-4">

                        <div class="d-flex justify-content-end gap-2">
                            <a th:href="@{/activities}" class="btn btn-outline-secondary">Cancel</a>
                            <button type="submit" class="btn btn-primary px-4 fw-semibold">
                                <i class="bi bi-save me-1"></i>Save Activity
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
