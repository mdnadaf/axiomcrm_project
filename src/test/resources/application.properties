spring.application.name=AcxiomCRM-Test

# In-memory H2 database for running unit and integration tests cleanly
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Security
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwt.expiration-ms=86400000
app.security.max-failed-attempts=5
app.security.lockout-duration-minutes=15

# Disable seeder during tests if needed or allow it to run
logging.level.com.acxiom.crm=INFO
